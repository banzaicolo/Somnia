[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Somnia project metadata + tooling config.
# This repo is a collection of scripts (no `pip install` required); this file
# 1) declares project metadata (read by GitHub) and 2) configures pytest.
# ============================================================================

[project]
name = "somnia"
version = "0.2.0"
description = "No-hardware playground for flexible pressure-sensor simulation, calibration and edge deployment (AI medical-bed starter kit)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Somnia Contributors" }]
keywords = ["pressure-sensor", "calibration", "sleep-posture", "edge-ai", "medical-bed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
# Script collection — no installable package.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
